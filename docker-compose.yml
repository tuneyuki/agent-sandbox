# ローカル開発用。GCP リソース無しで動く（履歴はメモリ、セッションフォルダはローカルボリューム）。
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
#   → API: http://localhost:8080/v1/...
# Vertex AI を使う場合は ANTHROPIC_API_KEY の代わりに下のコメントを外し、
# gcloud auth application-default login 済みの ADC をマウントする。
services:
  runner:
    build: ./runner
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # CLAUDE_CODE_USE_VERTEX: "1"
      # CLOUD_ML_REGION: global
      # ANTHROPIC_VERTEX_PROJECT_ID: your-project
      # GOOGLE_APPLICATION_CREDENTIALS: /adc.json
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      LOCAL_STORE_DIR: /store
    volumes:
      - store:/store
      # - ${HOME}/.config/gcloud/application_default_credentials.json:/adc.json:ro
  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    user: "10001"
    environment:
      AUTH_MODE: none
      STORE: memory
      EXECUTOR: local            # 本番は Cloud Run Jobs。ローカルは Runner の簡易サーバーに投げる
      RUNNER_URL: http://runner:8080
      CALLBACK_URL: http://gateway:8080
      LOCAL_STORE_DIR: /store
      ALLOWED_MODELS: claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5
    volumes:
      - store:/store
    depends_on: [runner]
volumes:
  store:
